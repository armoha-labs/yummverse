<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.75; transform:scale(0.96); } }
  </style>
</helmet>
<div style="width:390px; height:844px; background: radial-gradient(circle at 50% 30%, {{accent}} 0%, var(--bg) 65%); font-family: var(--font-body); color: var(--text); position:relative; overflow:hidden; border-radius:28px; border:1px solid oklch(90% 0.02 70); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;">

  <div style="width:92px; height:92px; border-radius:26px; background:white; box-shadow: 0 16px 40px oklch(20% 0 0 / 0.18); display:flex; align-items:center; justify-content:center; animation: pulse 1.8s ease-in-out infinite;">
    <div style="width:60px; height:60px; border-radius:16px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:22px;">GL</div>
  </div>

  <div style="text-align:center;">
    <div style="font-family: var(--font-display); font-weight:800; font-size:21px; color:white; text-shadow: 0 2px 12px oklch(20% 0 0 / 0.2);">Green Leaf Café</div>
    <div style="font-size:13.5px; color: white; opacity:0.9; margin-top:6px;">Table 12 · Koramangala</div>
  </div>

  <div style="font-size:13px; color: var(--text-muted); background:white; padding:9px 18px; border-radius:999px; box-shadow: 0 4px 14px oklch(20% 0 0 / 0.08);">Preparing your menu&hellip;</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
