<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --success: oklch(62% 0.14 150);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --shadow-md: 0 10px 26px oklch(20% 0 0 / 0.13);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  </style>
</helmet>
<div style="width:390px; height:844px; background: var(--bg); font-family: var(--font-body); color: var(--text); position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--border); display:flex; flex-direction:column;">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:22px 20px 6px;">
    <div>
      <div style="font-size:12px; color: var(--text-muted);">Order</div>
      <div style="font-family: var(--font-display); font-weight:800; font-size:19px;">#1042</div>
    </div>
    <div style="display:flex; align-items:center; gap:6px; background: oklch(94% 0.05 150); color: oklch(38% 0.1 150); padding:7px 12px; border-radius:999px; font-size:12px; font-weight:700;">
      <span style="width:7px; height:7px; border-radius:999px; background: var(--success); animation: pulse 1.6s ease-in-out infinite;"></span>
      Live
    </div>
  </div>

  <!-- Hero status -->
  <div style="margin:16px 20px; background:{{accent}}; border-radius:20px; padding:26px 22px; color:white; box-shadow: var(--shadow-md);">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;"><path d="M4 21h16"/><path d="M6 21V8a6 6 0 0 1 12 0v13"/><path d="M6 12h12"/></svg>
    <div style="font-family: var(--font-display); font-weight:800; font-size:19px;">Preparing your order</div>
    <div style="font-size:13px; opacity:0.85; margin-top:4px;">Estimated &middot; 8 minutes</div>
  </div>

  <!-- Stepper -->
  <div style="flex:1; padding:6px 26px; display:flex; flex-direction:column;">

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:26px; height:26px; border-radius:999px; background: var(--success); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="width:2px; flex:1; background: var(--success); min-height:20px;"></div>
      </div>
      <div style="padding-bottom:20px;">
        <div style="font-weight:600; font-size:14px;">Payment Confirmed</div>
        <div style="font-size:12px; color: var(--text-muted);">7:41 PM</div>
      </div>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:26px; height:26px; border-radius:999px; background: var(--success); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="width:2px; flex:1; background: var(--success); min-height:20px;"></div>
      </div>
      <div style="padding-bottom:20px;">
        <div style="font-weight:600; font-size:14px;">Order Received</div>
        <div style="font-size:12px; color: var(--text-muted);">7:41 PM</div>
      </div>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:26px; height:26px; border-radius:999px; background: var(--success); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div style="width:2px; flex:1; background: var(--border); min-height:20px;"></div>
      </div>
      <div style="padding-bottom:20px;">
        <div style="font-weight:600; font-size:14px;">Kitchen Accepted</div>
        <div style="font-size:12px; color: var(--text-muted);">7:42 PM</div>
      </div>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="position:relative; width:26px; height:26px; flex:0 0 auto;">
          <div style="position:absolute; inset:-5px; border-radius:999px; background:{{accent}}; opacity:0.18;"></div>
          <div style="position:absolute; inset:0; border-radius:999px; background:{{accent}};"></div>
        </div>
        <div style="width:2px; flex:1; background: var(--border); min-height:20px;"></div>
      </div>
      <div style="padding-bottom:20px;">
        <div style="font-weight:700; font-size:14px;">Preparing</div>
        <div style="font-size:12px; color: var(--text-muted);">In progress</div>
      </div>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:26px; height:26px; border-radius:999px; background: var(--surface); border:2px solid var(--border); flex:0 0 auto;"></div>
        <div style="width:2px; flex:1; background: var(--border); min-height:20px;"></div>
      </div>
      <div style="padding-bottom:20px;">
        <div style="font-weight:600; font-size:14px; color: var(--text-muted);">Ready</div>
      </div>
    </div>

    <div style="display:flex; gap:16px;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:26px; height:26px; border-radius:999px; background: var(--surface); border:2px solid var(--border); flex:0 0 auto;"></div>
      </div>
      <div>
        <div style="font-weight:600; font-size:14px; color: var(--text-muted);">Served</div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div style="padding:14px 20px 24px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:12.5px; color: var(--text-muted);">Table 12 &middot; Green Leaf Café</div>
    <div style="font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; border:1px solid var(--border);">View Receipt</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
