<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:390px; height:844px; background: var(--bg); font-family: var(--font-body); color: var(--text); position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--border); display:flex; flex-direction:column;">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:14px; padding:22px 20px 10px;">
    <div style="width:34px; height:34px; border-radius:10px; background: var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-family: var(--font-display); font-weight:800; font-size:18px;">Checkout</div>
  </div>

  <div style="flex:1; overflow:hidden; padding:16px 20px; display:flex; flex-direction:column; gap:18px;">

    <!-- Order summary card -->
    <div style="background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:12px;">
      <div style="font-family: var(--font-display); font-weight:700; font-size:14px; margin-bottom:2px;">Order Summary</div>

      <div style="display:flex; justify-content:space-between; font-size:13.5px;">
        <span style="color: var(--text-muted);">Cappuccino &times;2</span>
        <span>₹300</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:13.5px;">
        <span style="color: var(--text-muted);">Croissant &times;1</span>
        <span>₹90</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:13.5px;">
        <span style="color: var(--text-muted);">Iced Latte &times;1</span>
        <span>₹180</span>
      </div>

      <div style="height:1px; background: var(--border); margin:4px 0;"></div>

      <div style="display:flex; justify-content:space-between; font-size:13.5px; color: var(--text-muted);">
        <span>Subtotal</span><span style="color: var(--text);">₹570</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:13.5px; color: var(--text-muted);">
        <span>Tax (5%)</span><span style="color: var(--text);">₹28.5</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:13.5px; color: var(--text-muted);">
        <span>Service Charge</span><span style="color: var(--text);">₹21.5</span>
      </div>

      <div style="height:1px; background: var(--border); margin:4px 0;"></div>

      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <span style="font-family: var(--font-display); font-weight:700; font-size:15px;">Total</span>
        <span style="font-family: var(--font-display); font-weight:800; font-size:19px;">₹620</span>
      </div>
    </div>

    <!-- Customer details: name required, phone optional -->
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="font-family: var(--font-display); font-weight:700; font-size:13px; color: var(--text-muted);">Your details</div>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <div style="font-size:11.5px; font-weight:600; color: var(--text-muted);">Name <span style="color:{{accent}};">*</span></div>
        <div style="background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:13.5px; color: var(--text-muted);">Enter your name</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <div style="font-size:11.5px; font-weight:600; color: var(--text-muted);">Phone number <span style="font-weight:500;">(optional)</span></div>
        <div style="background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:13.5px; color: var(--text-muted);">For order-ready updates</div>
      </div>
    </div>

  </div>

  <!-- Sticky footer -->
  <div style="padding:14px 20px 26px; display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:100%; height:56px; border-radius:999px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:700; font-size:15.5px; box-shadow: 0 10px 26px oklch(20% 0 0 / 0.15);">
      Pay ₹620
    </div>
    <div style="display:flex; align-items:center; gap:6px; color: var(--text-muted); font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Secured by Green Leaf Café&rsquo;s payment gateway
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
