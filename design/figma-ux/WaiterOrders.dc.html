<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --success: oklch(62% 0.14 150);
      --success-soft: oklch(94% 0.05 150);
      --secondary-soft: oklch(94% 0.05 75);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:390px; height:844px; background: var(--bg); font-family: var(--font-body); color: var(--text); position:relative; overflow:hidden; border-radius:28px; border:1px solid var(--border); display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 14px; background: var(--surface); border-bottom:1px solid var(--border);">
    <div>
      <div style="font-family: var(--font-display); font-weight:800; font-size:17px;">Orders</div>
      <div style="font-size:12px; color: var(--text-muted); margin-top:2px;">Koramangala · Ravi Kumar</div>
    </div>
    <div style="width:36px; height:36px; border-radius:999px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:13px;">RK</div>
  </div>

  <div style="flex:1; overflow:hidden; padding:16px 18px 90px; display:flex; flex-direction:column; gap:12px;">

    <div style="font-size:11.5px; font-weight:700; color: oklch(38% 0.1 150); text-transform:uppercase; letter-spacing:0.03em;">Ready to serve</div>

    <div style="background: var(--surface); border:2px solid var(--success); border-radius:14px; padding:16px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-family: var(--font-display); font-weight:800; font-size:15px;">#1041 &middot; Table 4</div>
        <span style="background: var(--success-soft); color: oklch(38% 0.1 150); font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;">Ready</span>
      </div>
      <div style="font-size:12.5px; color: var(--text-muted);">Iced Latte, Choco Muffin ×2</div>
      <div style="text-align:center; padding:11px 0; border-radius:10px; background: var(--success); color:white; font-weight:700; font-size:13px;">Mark Served</div>
    </div>

    <div style="background: var(--surface); border:2px solid var(--success); border-radius:14px; padding:16px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-family: var(--font-display); font-weight:800; font-size:15px;">#1043 &middot; Table 8</div>
        <span style="background: var(--success-soft); color: oklch(38% 0.1 150); font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;">Ready</span>
      </div>
      <div style="font-size:12.5px; color: var(--text-muted);">Sandwich, Masala Tea</div>
      <div style="text-align:center; padding:11px 0; border-radius:10px; background: var(--success); color:white; font-weight:700; font-size:13px;">Mark Served</div>
    </div>

    <div style="font-size:11.5px; font-weight:700; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; margin-top:6px;">In progress</div>

    <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-family: var(--font-display); font-weight:800; font-size:15px;">#1042 &middot; Table 2</div>
        <span style="background:{{accent}}; color:white; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;">Preparing</span>
      </div>
      <div style="font-size:12.5px; color: var(--text-muted);">Cappuccino ×2, Croissant, Iced Latte</div>
    </div>

    <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-family: var(--font-display); font-weight:800; font-size:15px;">#1044 &middot; Table 5</div>
        <span style="background: var(--secondary-soft); color: oklch(45% 0.1 75); font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;">New</span>
      </div>
      <div style="font-size:12.5px; color: var(--text-muted);">Cold Brew ×2, Waffle</div>
    </div>

  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; background: var(--surface); border-top:1px solid var(--border); display:flex; padding:10px 8px calc(10px + env(safe-area-inset-bottom, 10px));">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--text-muted);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h3V8M15 8v12h3a1 1 0 0 0 1-1V8"/></svg>
      <span style="font-size:10px; font-weight:600;">Tables</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:{{accent}};">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 6l1.5 12a2 2 0 0 0 2 1.8h9a2 2 0 0 0 2-1.8L20 6M9 10v5M15 10v5"/></svg>
      <span style="font-size:10px; font-weight:700;">Orders</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
