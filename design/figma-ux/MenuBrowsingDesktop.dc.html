<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --shadow-md: 0 10px 26px oklch(20% 0 0 / 0.13);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:1280px; height:820px; background: var(--bg); font-family: var(--font-body); color: var(--text); overflow:hidden; border-radius:16px; border:1px solid var(--border); display:flex; flex-direction:column;">

  <!-- Top bar: mobile's sticky bottom cart bar becomes a header cart icon + badge -->
  <div style="display:flex; align-items:center; justify-content:center; padding:20px 40px; background: var(--surface); border-bottom:1px solid var(--border);">
    <div style="width:100%; max-width:1040px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:38px; height:38px; border-radius:11px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:15px;">GL</div>
        <div>
          <div style="font-family: var(--font-display); font-weight:800; font-size:16px; line-height:1.1;">Green Leaf Café</div>
          <div style="font-size:12px; color: var(--text-muted);">Table 12</div>
        </div>
      </div>
      <div style="flex:1; max-width:380px; margin:0 32px; background: var(--bg); border:1px solid var(--border); border-radius:11px; padding:10px 14px; display:flex; align-items:center; gap:8px; color: var(--text-muted); font-size:13px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Search the menu&hellip;
      </div>
      <div style="position:relative; width:42px; height:42px; border-radius:11px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <div style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:999px; background: var(--surface); color: var(--text); border:2px solid var(--surface); box-shadow: var(--shadow-sm); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;">3</div>
      </div>
    </div>
  </div>

  <!-- Centered content column -->
  <div style="flex:1; overflow:hidden; padding:28px 40px; display:flex; justify-content:center;">
    <div style="width:100%; max-width:1040px; display:flex; flex-direction:column; gap:24px;">

      <div style="display:flex; gap:10px;">
        <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
          <div style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.label}}</div>
        </sc-for>
      </div>

      <div>
        <div style="font-family: var(--font-display); font-weight:700; font-size:16px; margin-bottom:14px;">Recommended for you</div>
        <div style="display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:16px;">
          <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; box-shadow: var(--shadow-sm);">
            <div style="width:46px; height:46px; border-radius:10px; background: linear-gradient(135deg, oklch(85% 0.08 55), oklch(75% 0.1 40)); flex:0 0 auto;"></div>
            <div><div style="font-size:13px; font-weight:600;">Cappuccino</div><div style="font-size:12px; color: var(--text-muted);">₹150</div></div>
          </div>
          <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; box-shadow: var(--shadow-sm);">
            <div style="width:46px; height:46px; border-radius:10px; background: linear-gradient(135deg, oklch(88% 0.06 90), oklch(80% 0.08 80)); flex:0 0 auto;"></div>
            <div><div style="font-size:13px; font-weight:600;">Croissant</div><div style="font-size:12px; color: var(--text-muted);">₹90</div></div>
          </div>
          <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; box-shadow: var(--shadow-sm);">
            <div style="width:46px; height:46px; border-radius:10px; background: linear-gradient(135deg, oklch(78% 0.1 60), oklch(66% 0.13 40)); flex:0 0 auto;"></div>
            <div><div style="font-size:13px; font-weight:600;">Iced Latte</div><div style="font-size:12px; color: var(--text-muted);">₹180</div></div>
          </div>
          <div style="background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; box-shadow: var(--shadow-sm);">
            <div style="width:46px; height:46px; border-radius:10px; background: linear-gradient(135deg, oklch(82% 0.06 30), oklch(72% 0.09 20)); flex:0 0 auto;"></div>
            <div><div style="font-size:13px; font-weight:600;">Choco Muffin</div><div style="font-size:12px; color: var(--text-muted);">₹120</div></div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-family: var(--font-display); font-weight:700; font-size:16px; margin-bottom:14px;">{{sectionTitle}}</div>
        <div style="display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:18px; min-height:140px;">
          <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
            <div style="{{item.cardStyle}}">
              <div style="height:120px; {{item.gradientStyle}}"></div>
              <div style="padding:12px 14px 14px;"><div style="font-weight:600; font-size:14px;">{{item.name}}</div><div style="font-size:13px; color: var(--text-muted); margin-top:2px;">{{item.priceLabel}}</div></div>
              <sc-if value="{{item.available}}" hint-placeholder-val="{{true}}">
                <div style="position:absolute; right:12px; top:100px; width:34px; height:34px; border-radius:999px; background:{{item.quickAddBg}}; color:{{item.quickAddColor}}; border:{{item.quickAddBorder}}; display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-md);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
const CATEGORIES = ['All', 'Coffee', 'Breakfast', 'Desserts'];
const MENU_ITEMS = [
  { key: 'cappuccino', name: 'Cappuccino', price: 150, category: 'Coffee', gradFrom: 'oklch(80% 0.09 45)', gradTo: 'oklch(68% 0.12 35)', available: true },
  { key: 'croissant', name: 'Croissant', price: 90, category: 'Breakfast', gradFrom: 'oklch(88% 0.05 95)', gradTo: 'oklch(78% 0.08 85)', available: true },
  { key: 'iced-latte', name: 'Iced Latte', price: 180, category: 'Coffee', gradFrom: 'oklch(78% 0.1 60)', gradTo: 'oklch(66% 0.13 40)', available: true },
  { key: 'mocha', name: 'Mocha', price: 190, category: 'Coffee', gradFrom: 'oklch(75% 0.09 70)', gradTo: 'oklch(63% 0.11 55)', available: true },
  { key: 'espresso', name: 'Espresso', price: 130, category: 'Coffee', gradFrom: 'oklch(83% 0.07 20)', gradTo: 'oklch(70% 0.1 15)', available: false },
  { key: 'choco-muffin', name: 'Choco Muffin', price: 120, category: 'Desserts', gradFrom: 'oklch(82% 0.06 30)', gradTo: 'oklch(72% 0.09 20)', available: true }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedCategory: 'Coffee' };
  }

  renderVals() {
    const accent = this.props.accent ?? 'oklch(58% 0.15 40)';
    const selected = this.state.selectedCategory;

    const chips = CATEGORIES.map((cat) => {
      const active = cat === selected;
      return {
        key: cat,
        label: cat,
        style: active
          ? `padding:10px 22px; border-radius:999px; background:${accent}; color:white; font-size:13.5px; font-weight:600; font-family: var(--font-display);`
          : `padding:10px 22px; border-radius:999px; background: var(--surface); border:1px solid var(--border); color: var(--text-muted); font-size:13.5px; font-weight:600; font-family: var(--font-display);`,
        pick: () => this.setState({ selectedCategory: cat })
      };
    });

    const items = MENU_ITEMS
      .filter((it) => selected === 'All' || it.category === selected)
      .map((it) => ({
        key: it.key,
        name: it.name,
        available: it.available,
        priceLabel: it.available ? `₹${it.price}` : 'Sold out',
        gradientStyle: `background: linear-gradient(135deg, ${it.gradFrom}, ${it.gradTo});`,
        cardStyle: `background: var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow: var(--shadow-sm); position:relative; opacity:${it.available ? 1 : 0.5};`,
        quickAddBg: it.available ? accent : 'var(--surface)',
        quickAddColor: it.available ? 'white' : 'var(--text)',
        quickAddBorder: it.available ? 'none' : '1.5px solid var(--border)'
      }));

    return { accent, chips, items, sectionTitle: selected === 'All' ? 'All Items' : selected };
  }
}
</script>
</body>
</html>
