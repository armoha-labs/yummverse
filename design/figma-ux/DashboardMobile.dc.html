<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --success: oklch(62% 0.14 150);
      --success-soft: oklch(94% 0.05 150);
      --secondary-soft: oklch(94% 0.05 75);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --shadow-md: 0 10px 26px oklch(20% 0 0 / 0.13);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width:390px; height:844px; background: var(--bg); font-family: var(--font-body); color: var(--text); position:relative; overflow:hidden; border-radius:28px; border:1px solid var(--border); display:flex; flex-direction:column;">

  <!-- Top bar: sidebar collapses into a hamburger + drawer here -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 18px 14px; background: var(--surface); border-bottom:1px solid var(--border);">
    <div style="width:36px; height:36px; border-radius:10px; background: var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </div>
    <div style="font-family: var(--font-display); font-weight:800; font-size:16px;">Dashboard</div>
    <div style="width:36px; height:36px; border-radius:999px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:12px;">GL</div>
  </div>

  <!-- Reflowed content: 4-col stat grid -> 2-col; table -> stacked cards -->
  <div style="flex:1; overflow:hidden; padding:16px 18px 90px; display:flex; flex-direction:column; gap:16px;">

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; box-shadow: var(--shadow-sm);">
        <div style="font-size:11px; color: var(--text-muted); font-weight:600;">Today&rsquo;s Orders</div>
        <div style="font-family: var(--font-display); font-weight:800; font-size:20px; margin-top:6px;">128</div>
      </div>
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; box-shadow: var(--shadow-sm);">
        <div style="font-size:11px; color: var(--text-muted); font-weight:600;">Today&rsquo;s Revenue</div>
        <div style="font-family: var(--font-display); font-weight:800; font-size:20px; margin-top:6px;">₹42,180</div>
      </div>
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; box-shadow: var(--shadow-sm);">
        <div style="font-size:11px; color: var(--text-muted); font-weight:600;">Active Tables</div>
        <div style="font-family: var(--font-display); font-weight:800; font-size:20px; margin-top:6px;">6 / 12</div>
      </div>
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; box-shadow: var(--shadow-sm);">
        <div style="font-size:11px; color: var(--text-muted); font-weight:600;">Avg Prep Time</div>
        <div style="font-family: var(--font-display); font-weight:800; font-size:20px; margin-top:6px;">9.2 min</div>
      </div>
    </div>

    <div style="font-family: var(--font-display); font-weight:700; font-size:14px; margin-top:2px;">Live Orders</div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 14px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-weight:700; font-size:13.5px;">#1042 &middot; Table 12</div>
          <span style="background:{{accent}}; color:white; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;">Preparing</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted);">
          <span>Cappuccino ×2, Croissant</span><span style="font-weight:600; color: var(--text);">₹620</span>
        </div>
      </div>
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 14px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-weight:700; font-size:13.5px;">#1041 &middot; Table 4</div>
          <span style="background: var(--success-soft); color: oklch(38% 0.1 150); font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;">Ready</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted);">
          <span>Iced Latte, Muffin ×2</span><span style="font-weight:600; color: var(--text);">₹410</span>
        </div>
      </div>
      <div style="background: var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 14px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-weight:700; font-size:13.5px;">#1040 &middot; Table 8</div>
          <span style="background: var(--secondary-soft); color: oklch(45% 0.1 75); font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;">New</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted);">
          <span>Sandwich, Tea</span><span style="font-weight:600; color: var(--text);">₹250</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Collapsed nav: bottom bar for top items + "More" for the rest of the sidebar -->
  <div style="position:absolute; left:0; right:0; bottom:0; background: var(--surface); border-top:1px solid var(--border); display:flex; padding:10px 8px calc(10px + env(safe-area-inset-bottom, 10px));">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:{{accent}};">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span style="font-size:10px; font-weight:700;">Dashboard</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--text-muted);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 6l1.5 12a2 2 0 0 0 2 1.8h9a2 2 0 0 0 2-1.8L20 6M9 10v5M15 10v5"/></svg>
      <span style="font-size:10px; font-weight:600;">Orders</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--text-muted);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M6 21V8a6 6 0 0 1 12 0v13"/><path d="M6 12h12"/></svg>
      <span style="font-size:10px; font-weight:600;">Kitchen</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--text-muted);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v16H6a2 2 0 0 1-2-2Z"/><path d="M8 7h7M8 11h7"/></svg>
      <span style="font-size:10px; font-weight:600;">Menu</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--text-muted);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span style="font-size:10px; font-weight:600;">More</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
