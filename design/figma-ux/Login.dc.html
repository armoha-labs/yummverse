<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --shadow-md: 0 20px 50px oklch(20% 0 0 / 0.10);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:900px; height:680px; background: linear-gradient(160deg, {{accent}} 0%, oklch(30% 0.06 40) 100%); font-family: var(--font-body); color: var(--text); border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center;">

  <div style="width:400px; background: var(--surface); border-radius:20px; box-shadow: var(--shadow-md); padding:40px 36px; display:flex; flex-direction:column; gap:22px;">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="width:56px; height:56px; border-radius:16px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:22px;">GL</div>
      <div style="text-align:center;">
        <div style="font-family: var(--font-display); font-weight:800; font-size:19px;">Green Leaf Café</div>
        <div style="font-size:13px; color: var(--text-muted); margin-top:4px;">Sign in to your account</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:12px; font-weight:600; color: var(--text-muted);">Email</div>
        <div style="background: var(--bg); border:1px solid var(--border); border-radius:11px; padding:12px 14px; font-size:13.5px; color: var(--text-muted);">name@cafe.com</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:12px; font-weight:600; color: var(--text-muted);">Password</div>
        <div style="background: var(--bg); border:1px solid var(--border); border-radius:11px; padding:12px 14px; font-size:15px; letter-spacing:2px; color: var(--text-muted);">••••••••</div>
      </div>
    </div>

    <div style="text-align:center; padding:13px 0; border-radius:999px; background:{{accent}}; color:white; font-weight:700; font-size:14px;">Sign In</div>

    <div style="text-align:center; font-size:12.5px; color: var(--text-muted);">Forgot password?</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'oklch(58% 0.15 40)' };
  }
}
</script>
</body>
</html>
