<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(97.5% 0.012 75);
      --surface: oklch(99.2% 0.003 90);
      --border: oklch(90% 0.02 70);
      --text: oklch(23% 0.02 55);
      --text-muted: oklch(50% 0.02 55);
      --success: oklch(62% 0.14 150);
      --shadow-sm: 0 1px 2px oklch(20% 0 0 / 0.06);
      --shadow-md: 0 10px 26px oklch(20% 0 0 / 0.14);
      --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--text); } a:hover { color: var(--text); }
    ::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width:390px; height:844px; background: var(--bg); font-family: var(--font-body); color: var(--text); position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--border);">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 14px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:38px; height:38px; border-radius:11px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:800; font-size:15px;">GL</div>
      <div>
        <div style="font-family: var(--font-display); font-weight:800; font-size:16px; line-height:1.1;">Green Leaf Café</div>
        <div style="font-size:12px; color: var(--text-muted);">Table 12</div>
      </div>
    </div>
    <div style="width:38px; height:38px; border-radius:11px; background: var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>

  <!-- Category chips (tap to filter the grid below — client-side, no reload, §22B) -->
  <div style="display:flex; gap:8px; padding:4px 20px 14px; overflow-x:auto;">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
      <div style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.label}}</div>
    </sc-for>
  </div>

  <!-- Recommended carousel -->
  <div style="padding:0 20px 10px;">
    <div style="font-family: var(--font-display); font-weight:700; font-size:14px; margin-bottom:10px;">Recommended for you</div>
    <div style="display:flex; gap:12px; overflow-x:auto;">
      <div style="flex:0 0 auto; width:150px; background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px; display:flex; gap:10px; align-items:center; box-shadow: var(--shadow-sm);">
        <div style="width:40px; height:40px; border-radius:9px; background: linear-gradient(135deg, oklch(85% 0.08 55), oklch(75% 0.1 40)); flex:0 0 auto;"></div>
        <div style="min-width:0;">
          <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Cappuccino</div>
          <div style="font-size:11.5px; color: var(--text-muted);">₹150</div>
        </div>
      </div>
      <div style="flex:0 0 auto; width:150px; background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px; display:flex; gap:10px; align-items:center; box-shadow: var(--shadow-sm);">
        <div style="width:40px; height:40px; border-radius:9px; background: linear-gradient(135deg, oklch(88% 0.06 90), oklch(80% 0.08 80)); flex:0 0 auto;"></div>
        <div style="min-width:0;">
          <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Croissant</div>
          <div style="font-size:11.5px; color: var(--text-muted);">₹90</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Item grid — filtered by the selected category chip above -->
  <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:14px; padding:6px 20px 100px; min-height:120px;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <div style="{{item.cardStyle}}">
        <div style="height:110px; {{item.gradientStyle}}"></div>
        <div style="padding:10px 12px 12px;">
          <div style="font-weight:600; font-size:13.5px;">{{item.name}}</div>
          <div style="font-size:13px; color: var(--text-muted); margin-top:2px;">{{item.priceLabel}}</div>
        </div>
        <sc-if value="{{item.available}}" hint-placeholder-val="{{true}}">
          <div style="position:absolute; right:10px; top:92px; width:32px; height:32px; border-radius:999px; background:{{item.quickAddBg}}; color:{{item.quickAddColor}}; border:{{item.quickAddBorder}}; display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-md);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- Sticky cart bar -->
  <div style="position:absolute; left:16px; right:16px; bottom:20px; height:56px; border-radius:999px; background:{{accent}}; color:white; display:flex; align-items:center; justify-content:space-between; padding:0 10px 0 20px; box-shadow: var(--shadow-md);">
    <div style="font-family: var(--font-display); font-weight:700; font-size:14.5px;">3 items &middot; ₹420</div>
    <div style="width:38px; height:38px; border-radius:999px; background: oklch(100% 0 0 / 0.18); display:flex; align-items:center; justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(58% 0.15 40)","options":["oklch(58% 0.15 40)","oklch(55% 0.16 145)","oklch(55% 0.17 260)","oklch(60% 0.18 25)"],"section":"Tenant theme"}}'>
const CATEGORIES = ['All', 'Coffee', 'Breakfast', 'Desserts'];
const MENU_ITEMS = [
  { key: 'cappuccino', name: 'Cappuccino', price: 150, category: 'Coffee', gradFrom: 'oklch(80% 0.09 45)', gradTo: 'oklch(68% 0.12 35)', available: true },
  { key: 'croissant', name: 'Croissant', price: 90, category: 'Breakfast', gradFrom: 'oklch(88% 0.05 95)', gradTo: 'oklch(78% 0.08 85)', available: true },
  { key: 'iced-latte', name: 'Iced Latte', price: 180, category: 'Coffee', gradFrom: 'oklch(78% 0.1 60)', gradTo: 'oklch(66% 0.13 40)', available: true },
  { key: 'choco-muffin', name: 'Choco Muffin', price: 120, category: 'Desserts', gradFrom: 'oklch(82% 0.06 30)', gradTo: 'oklch(72% 0.09 20)', available: false }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedCategory: 'All' };
  }

  renderVals() {
    const accent = this.props.accent ?? 'oklch(58% 0.15 40)';
    const selected = this.state.selectedCategory;

    const chips = CATEGORIES.map((cat) => {
      const active = cat === selected;
      return {
        key: cat,
        label: cat,
        style: active
          ? `flex:0 0 auto; padding:9px 18px; border-radius:999px; background:${accent}; color:white; font-size:13.5px; font-weight:600; font-family: var(--font-display);`
          : `flex:0 0 auto; padding:9px 18px; border-radius:999px; background: var(--surface); border:1px solid var(--border); color: var(--text-muted); font-size:13.5px; font-weight:600; font-family: var(--font-display);`,
        pick: () => this.setState({ selectedCategory: cat })
      };
    });

    const items = MENU_ITEMS
      .filter((it) => selected === 'All' || it.category === selected)
      .map((it) => ({
        key: it.key,
        name: it.name,
        available: it.available,
        priceLabel: it.available ? `₹${it.price}` : 'Sold out',
        gradientStyle: `background: linear-gradient(135deg, ${it.gradFrom}, ${it.gradTo});`,
        cardStyle: `background: var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow: var(--shadow-sm); position:relative; opacity:${it.available ? 1 : 0.5};`,
        quickAddBg: it.available ? accent : 'var(--surface)',
        quickAddColor: it.available ? 'white' : 'var(--text)',
        quickAddBorder: it.available ? 'none' : '1.5px solid var(--border)'
      }));

    return { accent, chips, items };
  }
}
</script>
</body>
</html>
